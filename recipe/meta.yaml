{% set name = "json-logging" %}
{% set version = "1.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 8158a2cc7a156ffa3b5de6f68ae87e813fdfc9a05af4a99d31e10851c82197d7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - json_logging
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/bobbui/json-logging-python
  summary: JSON Python Logging
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cmutel
